#==============================================#
# Combine Thumper by RedSMURF: Configuration file #
#==============================================#

# To add a new Combine Thumper, follow the example below
# [Combine Thumper Name]
# THUMPER_FLAGS                     = a - Shaker           b - Damage              c - Push
# THUMPER_TEAM                      = 0 - None             1 - Terrorist           2 - Counter-Terrorist      3 - Both
# THUMPER_USE_TEAM                  = 0 - None             1 - Terrorist           2 - Counter-Terrorist      3 - Both
# THUMPER_FRAMERATE                 = Default framerate of the Combine Thumper (1.0 = normal speed)
# THUMPER_DAMAGE                    = Minimum and maximum damage dealt by the Combine Thumper (MIN MAX)
# THUMPER_DAMAGETYPE                = Damage type
# THUMPER_PUSH_FORWARD              = Minimum and maximum forward push force applied to entities (MIN MAX)
# THUMPER_PUSH_UP                   = Minimum and maximum upward push force applied to entities (MIN MAX)
# THUMPER_RANGE_SHAKE               = Minimum and maximum range in units for the shake effect (MIN MAX)
# THUMPER_RANGE_IMPACT              = Minimum and maximum range in units for the impact effect (MIN MAX)

# To make a Combine Thumper available in the menu, you must defined at least it's name like this [RedSMURF's Combine Thumper]
# Combine Thumper model and sound cannot be changed dynamically during gameplay

